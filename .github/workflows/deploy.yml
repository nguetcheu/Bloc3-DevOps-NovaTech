name: HRFlow Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  terraform:
    name: Provision infrastructure
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    outputs:
      instance_id: ${{ steps.tf-output.outputs.instance_id }}
    env:
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_jwt_refresh_secret: ${{ secrets.JWT_REFRESH_SECRET }}
      TF_VAR_redis_password: ${{ secrets.REDIS_PASSWORD }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_user: ${{ vars.DB_USER }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Terraform init & select workspace
        working-directory: ./terraform
        run: |
          terraform init
          terraform workspace select "${{ inputs.environment }}" || \
            terraform workspace new "${{ inputs.environment }}"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var-file="${{ inputs.environment }}.tfvars"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var-file="${{ inputs.environment }}.tfvars"

      - name: Get instance id
        id: tf-output
        working-directory: ./terraform
        run: echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"

  deploy-k8s:
    name: Deploy application to k3s
    runs-on: ubuntu-24.04
    needs: terraform
    environment: ${{ inputs.environment }}
    env:
      INSTANCE_ID: ${{ needs.terraform.outputs.instance_id }}
      NAMESPACE: hrflow-${{ inputs.environment }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4

      - name: Install Session Manager plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Wait for SSM agent to register
        run: |
          echo "Waiting for instance to be managed by SSM..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null)
            if [ "$STATUS" == "Online" ]; then
              echo "SSM agent is online."
              break
            fi
            echo "Attempt $i/30: SSM agent not ready yet (status:$STATUS)"
            sleep 10
          done

      - name: Wait for K3s to be ready  
        run: |
          echo "Waiting for K3s to be ready..."
          for i in $(seq 1 10); do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["test -f /etc/rancher/k3s/k3s.yaml && cat /etc/rancher/k3s/k3s.yaml | wc -l"]' \
              --query "Command.CommandId" --output text)

            sleep 2

            OUTPUT=$(aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --query "StandardOutputContent" --output text 2>/dev/null)

            if [ ! -z "$OUTPUT" ] && [ "$OUTPUT" -gt 10 ]; then
              echo "✓ K3s is ready ($(echo "$OUTPUT" | tr -d '\n') lines in kubeconfig)"
              break
            fi

            echo "[$i/60] Waiting for K3s to create kubeconfig..."
            sleep 5
          done

      - name: Fetch kubeconfig via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo cat /etc/rancher/k3s/k3s.yaml"]' \
            --query "Command.CommandId" --output text)

          # Remplace le "sleep 6" fixe : on attend que la commande SSM soit
          # réellement terminée (elle pouvait encore être "InProgress" après
          # 6s, ce qui produisait un kubeconfig.yaml vide et faisait retomber
          # kubectl sur son adresse par défaut http://localhost:8080).
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query "Status" --output text)

          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --query "StandardOutputContent" --output text | tr -d '\r' > kubeconfig.yaml

          if [ "$STATUS" != "Success" ] || [ ! -s kubeconfig.yaml ] || ! grep -q "apiVersion" kubeconfig.yaml; then
            echo "ERREUR : impossible de récupérer un kubeconfig valide via SSM (status: $STATUS)."
            echo "--- contenu récupéré ---"
            cat kubeconfig.yaml
            echo "--- stderr de la commande SSM ---"
            aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" \
              --command-id "$COMMAND_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|g' kubeconfig.yaml
          # La ligne "certificate-authority-data: <base64>" (présente par défaut dans
          # le k3s.yaml généré) n'était pas retirée par l'ancien sed, qui ne ciblait
          # que "certificate-authority: <chemin>" (un format que k3s n'utilise pas).
          # Résultat : certificate-authority-data restait en place en même temps que
          # insecure-skip-tls-verify: true, une combinaison invalide pour kubectl.
          sed -i '/certificate-authority-data:/d' kubeconfig.yaml
          sed -i 's|certificate-authority: /etc/rancher/k3s/k3s.crt|certificate-authority-data: |g' kubeconfig.yaml
          sed -i 's|insecure-skip-tls-verify: false|insecure-skip-tls-verify: true|g' kubeconfig.yaml

          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Start SSM port-forward tunnel to k3s API
        run: |
          aws ssm start-session \
            --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["6443"],"localPortNumber":["6443"]}' \
            > ssm-tunnel.log 2>&1 &
          echo "SSM_TUNNEL_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 6443 2>/dev/null; then
              echo "Tunnel SSM établi sur le port 6443."
              break
            fi
            echo "Attente du tunnel SSM... ($i/10)"
            sleep 3
          done

          if ! nc -z 127.0.0.1 6443 2>/dev/null; then
            echo "ERREUR : le tunnel SSM n'a jamais ouvert le port 6443."
            cat ssm-tunnel.log || true
            exit 1
          fi

          # AJOUTE CETTE PAUSE DE SÉCURITÉ POUR STABILISER LE TUNNEL TLS
          echo "Stabilisation du tunnel en cours..."
          sleep 3

      - name: Debug kubeconfig
        run: |
          echo "=== KUBECONFIG path ==="
          echo $KUBECONFIG
          echo "=== File exists? ==="
          ls -la $KUBECONFIG
          echo "=== Server address ==="
          grep "server:" $KUBECONFIG
          echo "=== Current context ==="
          kubectl config current-context

      - name: Wait for cluster
        env:
          KUBECONFIG: ${{ env.KUBECONFIG }}
        run: |
          for i in $(seq 1 10); do
            if kubectl --kubeconfig=$KUBECONFIG get nodes --request-timeout=10s; then
              echo "Cluster joignable."
              exit 0
            fi
            echo "Tentative $i/10 : cluster pas encore joignable via le tunnel SSM, nouvel essai..."
            sleep 5
          done

          echo "ERREUR : impossible de joindre le cluster via le tunnel SSM après plusieurs tentatives."
          cat ssm-tunnel.log || true
          exit 1

      - name: Install Traefik if missing
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              "if ! kubectl get deployment traefik -n kube-system >/dev/null 2>&1; then",
              "  helm repo add traefik https://traefik.github.io/charts || true",
              "  helm repo update",
              "  helm upgrade --install traefik traefik/traefik --namespace kube-system --set ports.web.hostPort=80 --set hostNetwork=true --wait --timeout 120s",
              "else",
              "  echo Traefik already installed.",
              "fi"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Waiting for Traefik install command to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

      - name: Apply namespace
        run: envsubst < k8s/namespace.yaml | kubectl apply -f -

      - name: Create/update ConfigMap
        run: |
          kubectl create configmap hrflow-config \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=NODE_ENV=production \
            --from-literal=DB_HOST=postgres \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME="${{ vars.DB_NAME }}" \
            --from-literal=AUTH_SERVICE_URL=http://auth:3001 \
            --from-literal=PAIE_SERVICE_URL=http://paie:3002 \
            --from-literal=CONGES_SERVICE_URL=http://conges:3003 \
            --from-literal=RECRUTEMENT_SERVICE_URL=http://recrutement:3004 \
            --from-literal=REDIS_HOST=redis \
            --from-literal=REDIS_PORT=6379 \
            --from-literal=CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/update Secret
        run: |
          kubectl create secret generic hrflow-secrets \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=DB_USER="${{ vars.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgresql://${{ vars.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ vars.DB_NAME }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Create ECR pull secret
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region "${{ secrets.AWS_REGION }}")

          kubectl create secret docker-registry ecr-pull-secret \
            --namespace "${{ env.NAMESPACE }}" \
            --docker-server="${{ steps.login-ecr.outputs.registry }}" \
            --docker-username=AWS \
            --docker-password="$ECR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Postgres and Redis
        run: |
          kubectl apply -f k8s/postgres/ -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/redis/ -n ${{ env.NAMESPACE }}
          kubectl rollout status statefulset/postgres -n ${{ env.NAMESPACE }} --timeout=90s
          kubectl rollout status statefulset/redis -n ${{ env.NAMESPACE }} --timeout=60s

      - name: Substitute image variables and deploy backend services
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in auth paie conges recrutement; do
            envsubst < k8s/$svc/deployment.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
            kubectl apply -f k8s/$svc/service.yaml -n ${{ env.NAMESPACE }}
          done

      - name: Wait for backend services
        run: |
          for svc in auth paie conges recrutement; do
            kubectl rollout status deployment/$svc -n ${{ env.NAMESPACE }} --timeout=120s
          done

      - name: Deploy gateway
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < k8s/gateway/deployment.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
          kubectl apply -f k8s/gateway/service.yaml -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/gateway -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Deploy frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          envsubst < k8s/frontend/deployment.yaml | kubectl apply -n ${{ env.NAMESPACE }} -f -
          kubectl apply -f k8s/frontend/service.yaml -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml -n ${{ env.NAMESPACE }}

      - name: Close SSM tunnel
        if: always()
        run: kill "$SSM_TUNNEL_PID" || true
 